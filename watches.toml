# Flights to watch. Edit this file to add, change or remove watches.
#
# Every watch is DIRECT FLIGHTS ONLY (set in [settings]).
#
# Fields for each [[watch]]:
#   name     - any label; it appears in the alerts
#   from, to - airport codes (BLR, DEL, BOM, SIN, HKT, ...)
#   depart   - departure date, YYYY-MM-DD
#   return   - return date for a round trip; leave it out for one way
#   flights  - the exact flights to watch, e.g. ["6E 1457", "6E 1458"]
#              (outbound first, then return). Leave it out to watch the
#              CHEAPEST direct option on those dates, whichever airline.
#   target   - optional: alert when the price falls to or below this (INR)
#
# A watch stops being checked once its departure date has passed.

[settings]
currency = "INR"
adults = 1
direct_only = true

# Alert when the price falls by at least this much since your last alert
# (the larger of the two numbers wins, so tiny wobbles stay quiet).
drop_alert_rupees = 500
drop_alert_percent = 3

# Also warn when a price climbs fast (a "book soon" signal).
rise_alerts = true
rise_alert_rupees = 1000
rise_alert_percent = 10

# Warn if an exact flight is missing this many checks in a row
# (sold out, schedule change, or Google not answering).
missing_checks_alert = 3



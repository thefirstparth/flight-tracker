<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e7e5e0">
<!--__PWA_HEAD__-->
<title>Flight Prices</title>
<style>
/* Fare board: one theme (warm stone), airport-signage navy, colour only for meaning.
   See DESIGN.md. Two levels: the trip list, then one trip's page. */
:root {
  color-scheme: light;
  --bg: #e7e5e0; --panel: #f6f5f2; --inset: #eeece7; --line: #dcd8d0;
  --ink: #161513; --ink-2: #57544e; --ink-3: #67635c;
  --navy: #1f3a5f; --navy-wash: #dfe5ec;
  --down: #12744a; --down-bg: #d9ede1; --up: #b3321f; --up-bg: #f5ded8; --amber: #835800; --amber-bg: #f1e6c9;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --radius: 20px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
a { color: var(--navy); text-decoration: none; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 720px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 64px; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; border-radius: 12px; }
h1:focus { outline: none; }
@media (prefers-reduced-motion: no-preference) {
  .view { animation: enter 0.24s ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}

/* top bar */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.top h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
.status { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--ink-2); font-size: 15px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--down); flex: none; }
.dot.warn { background: var(--up); }
.actions { display: flex; gap: 8px; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink-2); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.menu { position: relative; }
.menu summary { list-style: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu-pop { position: absolute; right: 0; top: 56px; z-index: 5; min-width: 160px; padding: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 32px rgba(22,21,19,0.14); }
.menu-pop a { display: block; padding: 12px; border-radius: 10px; color: var(--ink); }
.menu-pop a:hover { background: var(--inset); }
.notice { margin-top: 16px; padding: 12px 16px; border-radius: 16px; background: var(--navy-wash); color: var(--navy); font-size: 15px; }

/* ---------- level 1: the trip list ---------- */
.list { margin-top: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; gap: 4px 16px; align-items: center;
  padding: 20px 24px; border-top: 1px solid var(--line); color: var(--ink); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--inset); }
.row:focus-visible { outline-offset: -3px; border-radius: var(--radius); }
.row .route { font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; }
.row .city { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.row .when { font-size: 15px; color: var(--ink-2); margin-top: 2px; }
.row .right { text-align: right; }
.row .price { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.row .chev { color: var(--ink-3); }
.row .chev svg { width: 16px; height: 16px; display: block; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--navy-wash); color: var(--navy); letter-spacing: 0; }
.word { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 650; margin-top: 4px; white-space: nowrap; }
.word::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.w-book { color: var(--down); } .w-fair { color: var(--amber); } .w-wait { color: var(--up); } .w-none { color: var(--ink-3); }

/* ---------- level 2: one trip ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 48px; margin: -8px 0 8px -8px; padding: 0 12px 0 8px;
  color: var(--navy); font-weight: 600; border-radius: 12px; }
.back svg { width: 20px; height: 20px; }
.trip-head .route { font-family: var(--mono); font-size: 14px; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600;
  display: flex; align-items: center; gap: 8px; }
.trip-head h1 { margin: 4px 0 0; font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
.trip-head .when { color: var(--ink-2); margin-top: 4px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 16px; overflow: hidden; }
.pad { padding: 24px; }
.price-block .big { font-size: 48px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }
.price-block .sub { color: var(--ink-3); font-size: 14px; margin-top: 8px; }
.pill { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 15px; font-weight: 650;
  padding: 6px 14px 6px 12px; border-radius: 999px; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.p-book { background: var(--down-bg); color: var(--down); }
.p-fair { background: var(--amber-bg); color: var(--amber); }
.p-wait { background: var(--up-bg); color: var(--up); }
.reason { margin: 12px 0 0; color: var(--ink-2); font-size: 15px; }

.seg { display: flex; background: var(--inset); border-radius: 12px; padding: 4px; margin: 0 0 12px; }
.seg button { flex: 1; min-height: 44px; border: 0; background: transparent; padding: 8px 12px; border-radius: 9px; cursor: pointer;
  color: var(--ink-2); font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(22,21,19,0.16); }
.seg-note { font-size: 14px; color: var(--ink-2); margin: 0 0 16px; }

.board { border-top: 1px solid var(--line); background: var(--inset); padding: 4px 24px; }
.leg { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 16px 0;
  border-top: 1px dashed var(--line); }
.leg:first-child { border-top: 0; }
.leg .dir { font-size: 12px; letter-spacing: 0.09em; font-weight: 700; color: var(--ink-3); }
.leg .times { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
.leg .times .to { color: var(--ink-3); font-weight: 400; margin: 0 6px; }
.leg .times sup { font-size: 12px; color: var(--ink-3); }
.leg .date { font-size: 14px; color: var(--ink-2); }
.leg .meta { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); min-width: 0; }
.leg .meta .code { font-family: var(--mono); font-weight: 600; color: var(--ink); white-space: nowrap; }
.leg .dur { text-align: right; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.logo { width: 24px; height: 24px; border-radius: 6px; flex: none; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; }
.book-wrap { padding: 16px 24px 24px; border-top: 1px solid var(--line); }
.book { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 16px;
  background: var(--navy); color: #fff; font-weight: 700; font-size: 17px; }
.book:hover { background: #18304f; }

.section h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.section .lead { margin: 4px 0 0; color: var(--ink-2); font-size: 15px; }
.section .lead b { color: var(--ink); }
.foot { font-size: 13px; color: var(--ink-3); margin-top: 12px; }

.chart { position: relative; margin-top: 16px; min-height: 200px; }
.chart svg { display: block; width: 100%; height: 200px; touch-action: pan-y; }
.chart .grid { stroke: var(--line); }
.chart .tick { fill: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .band { fill: var(--down-bg); }
.chart .band-label { fill: var(--down); font-size: 12px; font-weight: 600; }
.chart .cross { stroke: var(--ink-3); stroke-dasharray: 3 3; }
.tip { position: absolute; top: -8px; pointer-events: none; background: var(--ink); color: var(--panel); border-radius: 10px;
  padding: 6px 10px; font-size: 13px; white-space: nowrap; }

.weeks { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; align-items: end; height: 176px; margin-top: 16px; }
.wk { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.wk .bar { width: 100%; max-width: 44px; border-radius: 6px 6px 3px 3px; background: #cfcac0; }
.wk.yours .bar { background: var(--navy); }
.wk.cheap .bar { background: var(--down); }
.wk .val { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wk.yours .val { color: var(--navy); }
.wk.cheap .val { color: var(--down); }
.wk .lbl { font-size: 12px; color: var(--ink-3); white-space: nowrap; text-align: center; line-height: 1.2; }
.wk.yours .lbl { color: var(--ink); font-weight: 700; }
.wk.cheap .lbl { color: var(--down); font-weight: 600; }

.disclose { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 48px; margin-top: 16px;
  padding: 0; border: 0; border-top: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 600; text-align: left; }
.disclose svg { width: 20px; height: 20px; color: var(--ink-3); transition: transform 0.2s; }
.disclose[aria-expanded="true"] svg { transform: rotate(180deg); }
table.near { width: calc(100% + 12px); border-collapse: separate; border-spacing: 6px; margin: 4px -6px 0; table-layout: fixed; }
table.near th { font-size: 12px; color: var(--ink-3); font-weight: 600; padding: 4px 0; }
table.near thead th { text-align: center; }
table.near thead th:first-child, table.near tbody th { text-align: left; width: 80px; }
table.near td { border-radius: 12px; background: var(--inset); padding: 12px 4px; text-align: center; font-size: 14px; font-weight: 650;
  font-variant-numeric: tabular-nums; border: 2px solid transparent; }
table.near td small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); }
table.near td.yours { border-color: var(--navy); background: var(--panel); }
table.near td.save { background: var(--down-bg); color: var(--down); }
table.near td.na { color: var(--ink-3); font-weight: 400; }

footer { margin-top: 40px; text-align: center; color: var(--ink-3); font-size: 13px; }
.empty { text-align: center; padding: 48px 16px; color: var(--ink-2); }
html:not(.js) .actions { display: none; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; }
table.data td, table.data th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }

@media (max-width: 560px) {
  .top h1 { font-size: 28px; }
  .row { padding: 16px; gap: 2px 12px; }
  .row .city { font-size: 20px; }
  .row .price { font-size: 20px; }
  .pad { padding: 20px 16px; }
  .board { padding: 4px 16px; }
  .book-wrap { padding: 16px; }
  .trip-head h1 { font-size: 32px; }
  .price-block .big { font-size: 42px; }
  .leg .times { font-size: 18px; }
  .weeks { gap: 4px; }
  table.near { width: calc(100% + 8px); border-spacing: 4px; margin: 4px -4px 0; }
  table.near thead th:first-child, table.near tbody th { width: 58px; }
  table.near td { font-size: 13px; padding: 10px 2px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
  <!--__NOSCRIPT__-->
  <footer>Prices from Google Flights · 1 adult · economy · direct flights · confirm on the airline's site before booking</footer>
</div>
<script id="data" type="application/json">/*__DASHBOARD_DATA__*/null</script>
<script>
"use strict";
document.documentElement.classList.add("js");
const D = JSON.parse(document.getElementById("data").textContent) || {watches: [], trips: []};
const TZ = "Asia/Kolkata", MIN = 60000, DAY = 24 * 60 * MIN;
const nf = new Intl.NumberFormat("en-IN", {maximumFractionDigits: 0});
const inr = v => v == null ? "–" : "₹" + nf.format(Math.round(v));
const inrK = v => "₹" + (Math.round(v / 100) / 10) + "k";
const t = s => s ? Date.parse(s) : NaN;
const dOnly = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fmt = o => new Intl.DateTimeFormat("en-GB", Object.assign({timeZone: "UTC"}, o));
const fDM = fmt({day: "numeric", month: "short"}), fWDM = fmt({weekday: "short", day: "numeric", month: "short"});
const fW = fmt({weekday: "short"}), fD = fmt({day: "numeric"}), fM = fmt({month: "short"});
const fTime = new Intl.DateTimeFormat("en-GB", {timeZone: TZ, hour: "numeric", minute: "2-digit", hour12: true});
const AIR = Object.assign({}, D.airlines || {}, {"6E": "IndiGo", QP: "Akasa Air", IX: "Air India Express", AI: "Air India",
  SQ: "Singapore Airlines", TR: "Scoot"});
const LOGO = {"6E": "#1b2a8a", QP: "#e8541a", IX: "#c8441a", AI: "#a8121b", SQ: "#1c2d5a", TR: "#b38900",
  SG: "#c8102e", UK: "#5b2a5e", TG: "#5a2d82", FD: "#d71920", EK: "#c60c30"};
const CITY = {SIN: "Singapore", HKT: "Phuket", BLR: "Bengaluru", DEL: "Delhi", BOM: "Mumbai", MAA: "Chennai",
  HYD: "Hyderabad", CCU: "Kolkata", DXB: "Dubai", BKK: "Bangkok", KUL: "Kuala Lumpur", DPS: "Bali"};
const city = c => CITY[c] || c;
const code = f => f.split(" ")[0];
const WORD = {book: ["w-book", "Book now"], fair: ["w-fair", "Fair"], wait: ["w-wait", "Wait"]};
const PILL = {book: "p-book", fair: "p-fair", wait: "p-wait"};

function h(tag, attrs, ...kids) {  // text always goes in as text nodes, never HTML
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs, text) => { const el = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v); if (text != null) el.textContent = text; return el; };
const icon = d => { const v = s("svg", {viewBox: "0 0 24 24", "aria-hidden": "true"}); v.append(s("path", {d, fill: "currentColor"})); return v; };
const I_REFRESH = "M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z";
const I_MORE = "M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z";
const I_CHEV_D = "M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z";
const I_CHEV_R = "M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z";
const I_CHEV_L = "M15.41 16.59 10.83 12l4.58-4.59L14 6l-6 6 6 6z";

const ago = ms => { const m = Math.round((Date.now() - ms) / MIN); if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const hr = Math.round(m / 60); return hr < 36 ? hr + " hr ago" : Math.round(hr / 24) + " days ago"; };
const todayIST = () => new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(new Date());
const daysUntil = d => Math.round((dOnly(d) - dOnly(todayIST())) / DAY);
const hm = iso => iso.slice(11, 16);
const dur = m => Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m";
const median = a => { const b = [...a].sort((x, y) => x - y), n = b.length; return n ? (n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2) : null; };
const significant = (save, base) => save >= Math.max(1000, base * 0.05);
function logo(f) { const c = code(f); return h("span", {class: "logo", style: `background:${LOGO[c] || "#67635c"}`, "aria-hidden": "true"}, c); }
function dateRange(a, b) {  // "Fri 22 – Tue 26 Jan" when both dates share a month
  const A = dOnly(a);
  if (!b) return fWDM.format(A);
  const B = dOnly(b);
  return A.getUTCMonth() === B.getUTCMonth() ? `${fW.format(A)} ${fD.format(A)} – ${fW.format(B)} ${fDM.format(B)}`
    : `${fWDM.format(A)} – ${fWDM.format(B)}`;
}
function routeText(w) {
  return [w.from + " ", h("span", {"aria-hidden": "true"}, w.return ? "⇄" : "→"),
    h("span", {class: "sr"}, w.return ? "to and from" : "to"), " " + w.to];
}
function daysText(n) { return n > 1 ? `in ${n} days` : n === 1 ? "tomorrow" : n === 0 ? "today" : "departed"; }

// The flights to show for a trip: "cheapest" is what is tracked and alerted on;
// "pick" is the cheapest option with your preferred flight, when you have one.
function preferredIndex(w) { return (w.flights || []).findIndex(p => p.includes("|")); }
function yourPick(w) {
  const i = preferredIndex(w);
  if (i < 0 || !(w.choices || []).length) return null;
  const pref = w.flights[i].split("|")[0];
  return w.choices.filter(c => c.flights[i] === pref).sort((a, b) => a.price - b.price)[0] || null;
}

// ---------------- status (top of the list) ----------------
function statusLine() {
  const last = t(D.updated_at), G = D.google_status || {};
  if (G.refused_runs > 0) {
    const since = Math.max(t(G.last_answer_at) || 0, t(D.prices_at) || 0), next = t(G.pause_until);
    return [true, `Google isn't answering · prices from ${since ? ago(since) : "earlier"}` +
      (next && next > Date.now() ? ` · next try ${fTime.format(new Date(next))}` : " · retrying")];
  }
  if (!last) return [false, "Waiting for the first price check"];
  const stale = Date.now() - last > 3 * (D.check_every_minutes || 30) * MIN;
  return [stale, stale ? `Prices from ${ago(last)} · checks seem to have stopped` : `Prices checked ${ago(last)}`];
}
function refreshStatus() {  // once a minute: only the status text changes, nothing else is rebuilt
  const el = document.getElementById("status-text"), dot = document.getElementById("status-dot");
  if (!el || document.querySelector(".spin")) return;
  const [warn, text] = statusLine();
  el.textContent = text; dot.className = "dot" + (warn ? " warn" : "");
}

// ---------------- level 1: the trip list ----------------
function greeting() {
  const hr = Number(new Intl.DateTimeFormat("en-GB", {timeZone: TZ, hour: "numeric", hourCycle: "h23"}).format(new Date()));
  const part = hr >= 5 && hr < 12 ? "morning" : hr >= 12 && hr < 17 ? "afternoon" : "evening";
  return `Good ${part}${D.owner ? ", " + D.owner : ""}`;
}
function actions() {
  if (!D.web) return null;
  const btn = h("button", {class: "icon-btn", type: "submit", "aria-label": "Check prices now", title: "Check prices now"}, icon(I_REFRESH));
  return h("div", {class: "actions"},
    h("form", {method: "post", action: D.web.check_now, style: "margin:0", onsubmit: () => {
      btn.classList.add("spin"); btn.disabled = true;
      const st = document.getElementById("status-text"); if (st) st.textContent = "Checking prices… up to a minute"; }}, btn),
    h("details", {class: "menu"}, h("summary", {class: "icon-btn", "aria-label": "More", title: "More"}, icon(I_MORE)),
      h("div", {class: "menu-pop"}, h("a", {href: D.web.setup}, "Setup"), h("a", {href: D.web.logout}, "Log out"))));
}
function listView() {
  const [warn, text] = statusLine();
  const ws = [...(D.watches || [])].sort((a, b) => a.depart < b.depart ? -1 : a.depart > b.depart ? 1 : 0);
  const rows = ws.map(w => {
    const st = w.state || {}, a = w.advice;
    const [cls, word] = st.misses ? ["w-wait", "Not found"] : a ? WORD[a.verdict] : ["w-none", st.last == null ? "Checking…" : ""];
    return h("a", {class: "row", href: "#/trip/" + encodeURIComponent(w.id)},
      h("div", null,
        h("div", {class: "route"}, routeText(w)),
        h("div", {class: "city"}, city(w.to), w.who ? h("span", {class: "tag"}, w.who) : null),
        h("div", {class: "when"}, `${dateRange(w.depart, w.return)} · `, h("span", {style: "white-space:nowrap"}, daysText(daysUntil(w.depart))))),
      h("div", {class: "right"},
        h("div", {class: "price num"}, st.last != null ? inr(st.last) : "—"),
        word ? h("div", {class: "word " + cls}, word) : null),
      h("span", {class: "chev"}, icon(I_CHEV_R)));
  });
  return h("div", {class: "view"},
    h("header", {class: "top"},
      h("div", null, h("h1", {tabindex: "-1"}, greeting()),
        h("div", {class: "status"}, h("span", {class: "dot" + (warn ? " warn" : ""), id: "status-dot"}), h("span", {id: "status-text"}, text))),
      actions()),
    (D.web && D.web.notice) || D.demo ? h("div", {class: "notice"}, (D.web && D.web.notice) || "Preview with made-up price history.") : null,
    rows.length ? h("nav", {class: "list", "aria-label": "Trips"}, rows) : h("div", {class: "empty"}, "No flights tracked yet."));
}

// ---------------- level 2: one trip ----------------
function legRow(dir, leg) {
  const c = code(leg.flight);
  const next = leg.arr.slice(0, 10) > leg.dep.slice(0, 10);
  return h("div", {class: "leg"},
    h("div", {class: "dir"}, dir),
    h("div", null, h("div", {class: "date"}, fWDM.format(dOnly(leg.dep.slice(0, 10)))),
      h("div", {class: "times"}, hm(leg.dep), h("span", {class: "to", "aria-label": "to"}, "→"), hm(leg.arr),
        next ? h("sup", {"aria-label": "next day"}, "+1") : null)),
    h("div", {class: "dur"}, dur(leg.minutes)),
    h("div", {class: "meta"}, logo(leg.flight), h("span", {class: "code"}, leg.flight), h("span", null, AIR[c] || c)));
}
function board(option) {
  const legs = (option && option.legs) || [];
  if (!legs.length) return h("div", {class: "board"}, h("div", {class: "leg"}, h("div", {class: "dir"}, ""), h("div", {class: "date"}, "Flight times appear after the first check.")));
  return h("div", {class: "board"}, legs.map((l, i) => legRow(i === 0 ? "OUT" : "BACK", l)));
}
function pricePanel(w, which) {
  const st = w.state || {}, a = w.advice;
  const pick = yourPick(w);
  const hasSwitch = pick && w.current && pick.price !== w.current.price;
  if (!hasSwitch) which = "cheapest";
  const price = which === "pick" ? pick.price : st.last;
  const option = which === "pick" ? pick : w.current;
  const block = h("div", {class: "pad price-block"});
  if (hasSwitch) {
    const pref = w.flights[preferredIndex(w)].split("|")[0], diff = pick.price - w.current.price;
    block.append(
      h("div", {class: "seg", role: "group", "aria-label": "Which flights to show"},
        [["pick", "Your pick"], ["cheapest", "Cheapest"]].map(([k, label]) => h("button", {type: "button", "data-k": k,
          "aria-pressed": String(k === which), onclick: () => { if (k !== which) { state.which[w.id] = k; render(k); } }}, label))),
      h("p", {class: "seg-note"}, which === "pick"
        ? `With your ${pref} · ${inr(diff)} more than the cheapest (${inr(w.current.price)})`
        : `Cheapest acceptable flights · ${inr(diff)} less than with your ${pref}`));
  }
  const checked = w.checked_at || D.updated_at;
  block.append(...[
    h("div", {class: "big num"}, price != null ? inr(price) : "—"),
    h("div", {class: "sub"}, `${w.return ? "Round trip" : "One way"}${checked ? " · checked " + ago(t(checked)) : ""}`),
    st.misses ? h("div", {class: "pill p-wait"}, "Not found on the last check") : null,
    a ? h("div", {class: "pill " + PILL[a.verdict]}, a.title) : null,
    a ? h("p", {class: "reason"}, a.summary) : null,
    w.target && st.last != null && st.last > w.target ? h("p", {class: "reason"}, `Telegram alert when it drops to ${inr(w.target)}.`) : null,
  ].filter(Boolean));
  return [block, board(option),
    h("div", {class: "book-wrap"}, h("a", {class: "book", href: w.link, target: "_blank", rel: "noopener noreferrer"},
      "Book on Google Flights", h("span", {class: "sr"}, " (opens in a new tab)")))];
}

let chartObserver = null;  // one at a time; disconnected whenever the page is rebuilt
function historyChart(w) {
  const g = w.google;
  const pts = g && (g.history || []).length ? g.history.map(([d, p]) => [dOnly(d).getTime(), p])
    : (w.points || []).map(([ts, p]) => [t(ts), p]).filter(p => p[1] != null);
  if (pts.length < 2) return null;
  const wrap = h("div", {class: "chart"});
  const tip = h("div", {class: "tip", hidden: true}); wrap.append(tip);
  let lastW = 0;
  const draw = () => {
    const W = wrap.clientWidth;
    if (!W || W === lastW) return;
    lastW = W;
    const old = wrap.querySelector("svg"); if (old) old.remove();
    const H = 200, ml = 46, mr = 8, mt = 16, mb = 24;
    const x0 = pts[0][0], x1 = Math.max(pts[pts.length - 1][0], x0 + DAY);
    let lo = Math.min(...pts.map(p => p[1]), g ? g.low : Infinity), hi = Math.max(...pts.map(p => p[1]), g ? g.high : 0);
    const pad = (hi - lo) * 0.08 || 500; lo -= pad; hi += pad;
    const X = x => ml + (x - x0) / (x1 - x0) * (W - ml - mr), Y = v => mt + (1 - (v - lo) / (hi - lo)) * (H - mt - mb);
    const svg = s("svg", {viewBox: `0 0 ${W} ${H}`, role: "img",
      "aria-label": `Price over the last ${pts.length} days: from ${inr(pts[0][1])} to ${inr(pts[pts.length - 1][1])}` + (g ? `; usually ${inr(g.low)} to ${inr(g.high)}` : "")});
    if (g) {
      svg.append(s("rect", {x: ml, width: W - ml - mr, y: Y(g.high), height: Y(g.low) - Y(g.high), class: "band"}),
        s("text", {x: W - mr - 6, y: Y(g.low) - 6, "text-anchor": "end", class: "band-label"}, "Usual price range"));
      for (const v of [g.low, g.high]) svg.append(s("text", {x: ml - 6, y: Y(v) + 4, "text-anchor": "end", class: "tick"}, inrK(v)));
    } else for (const v of [Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[1]))])
      svg.append(s("line", {x1: ml, x2: W - mr, y1: Y(v), y2: Y(v), class: "grid"}), s("text", {x: ml - 6, y: Y(v) + 4, "text-anchor": "end", class: "tick"}, inrK(v)));
    let d = ""; pts.forEach(([ts, p], k) => { d += k ? `H${X(ts)}V${Y(p)}` : `M${X(ts)},${Y(p)}`; });
    const last = pts[pts.length - 1];
    svg.append(s("path", {d, fill: "none", stroke: "var(--navy)", "stroke-width": 2.5, "stroke-linejoin": "round"}),
      s("circle", {cx: X(last[0]), cy: Y(last[1]), r: 5, fill: "var(--navy)", stroke: "var(--panel)", "stroke-width": 2}),
      s("text", {x: ml, y: H - 4, class: "tick"}, fDM.format(new Date(x0))),
      s("text", {x: W - mr, y: H - 4, "text-anchor": "end", class: "tick"}, "Today"));
    const cross = s("line", {y1: mt, y2: H - mb, class: "cross", visibility: "hidden"});
    const dot = s("circle", {r: 5, fill: "var(--navy)", stroke: "var(--panel)", "stroke-width": 2, visibility: "hidden"});
    svg.append(cross, dot);
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const px = Math.max(ml, Math.min(W - mr, (ev.clientX - r.left) * W / r.width));
      const x = x0 + (px - ml) / (W - ml - mr) * (x1 - x0);
      let v = pts[0]; for (const p of pts) if (p[0] <= x) v = p;
      cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
      dot.setAttribute("cx", px); dot.setAttribute("cy", Y(v[1])); dot.setAttribute("visibility", "visible");
      tip.replaceChildren(h("b", null, inr(v[1])), " · " + fDM.format(new Date(v[0]))); tip.hidden = false;
      const cx = px * r.width / W; tip.style.left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), r.width - tip.offsetWidth) + "px";
    };
    svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
    svg.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); });
    wrap.prepend(svg);
  };
  chartObserver = new ResizeObserver(draw);
  chartObserver.observe(wrap);
  return h("section", {class: "panel pad section"}, h("h2", null, "Price over the last 60 days"),
    h("p", {class: "lead"}, g ? "Cheapest direct round trip for your dates, on any airline." : "Your tracked flights, since tracking began."), wrap);
}

function otherWeeks(w) {
  const ins = w.insights;
  if (!ins || !(ins.similar || []).length || ins.yours == null) return null;
  const others = ins.similar.filter(x => x.depart !== w.depart).map(x => x.price);
  const typical = median(others);
  if (!typical) return null;
  const extra = ins.yours - typical, pct = Math.round(extra / typical * 100);
  const name = w.return ? `${fW.format(dOnly(w.depart))}–${fW.format(dOnly(w.return))}` : fW.format(dOnly(w.depart));
  const lead = Math.abs(pct) < 5 ? [`About what a ${name} trip usually costs (`, h("b", {class: "num"}, inr(typical)), ").`"]
    : extra > 0 ? ["You're paying ", h("b", {class: "num"}, `${inr(extra)} (${pct}%) more`), ` than for a typical ${name} trip (${inr(typical)}).`]
    : ["You're paying ", h("b", {class: "num"}, `${inr(-extra)} (${-pct}%) less`), ` than for a typical ${name} trip (${inr(typical)}).`];
  const list = ins.similar, hi = Math.max(...list.map(x => x.price)), lo = Math.min(...list.map(x => x.price));
  const cheapest = list.find(x => x.price === lo && x.depart !== w.depart);
  const bars = h("div", {class: "weeks", role: "img", "aria-label": list.map(x => `${fDM.format(dOnly(x.depart))}: ${inr(x.price)}`).join(", ")},
    list.map(x => {
      const mine = x.depart === w.depart, cheap = x === cheapest;
      return h("div", {class: "wk" + (mine ? " yours" : cheap ? " cheap" : "")},
        mine || cheap ? h("div", {class: "val"}, inrK(x.price)) : null,
        h("div", {class: "bar", style: `height:${Math.max(4, x.price / hi * 100)}%`}),
        h("div", {class: "lbl"}, fD.format(dOnly(x.depart)), h("br"), mine ? "yours" : cheap ? "lowest" : fM.format(dOnly(x.depart))));
    }));
  // a day earlier or later, behind a tap (stays open while you switch flights)
  let more = null;
  if ((ins.nearby || []).length) {
    const open = !!state.open[w.id];
    const body = h("div", {hidden: !open}, open ? nearbyTable(w, ins) : null);
    const btn = h("button", {class: "disclose", type: "button", "aria-expanded": String(open), onclick: () => {
      const now = btn.getAttribute("aria-expanded") !== "true";
      state.open[w.id] = now; btn.setAttribute("aria-expanded", String(now)); body.hidden = !now;
      if (now && !body.firstChild) body.append(nearbyTable(w, ins));
    }}, "A day earlier or later", icon(I_CHEV_D));
    more = [btn, body];
  }
  return h("section", {class: "panel pad section"}, h("h2", null, "Same trip, other weeks"), h("p", {class: "lead"}, lead),
    bars, h("p", {class: "foot"}, `The same ${name} trip within a month of yours · cheapest direct round trip on any airline.`), more);
}
function nearbyTable(w, ins) {
  const near = ins.nearby, yours = ins.yours;
  const deps = [...new Set(near.map(x => x.depart))].sort();
  const rets = [...new Set(near.map(x => x.return).filter(Boolean))].sort();
  const find = (d, r) => near.find(x => x.depart === d && (x.return || null) === (r || null));
  const cell = (d, r) => {
    const x = find(d, r), mine = d === w.depart && (r || null) === (w.return || null);
    if (!x || x.price == null) return h("td", {class: "na"}, "—");
    if (mine) return h("td", {class: "yours"}, inr(x.price), h("small", null, "your dates"));
    const diff = x.price - yours;
    return h("td", {class: significant(-diff, yours) ? "save" : null},
      diff < 0 ? `save ${inr(-diff)}` : diff > 0 ? `+${inr(diff)}` : "same", h("small", null, inr(x.price)));
  };
  const cols = rets.length ? rets : [null];
  return h("table", {class: "near"},
    h("caption", {class: "sr"}, "Price difference if you leave or come back a day earlier or later"),
    h("thead", null, h("tr", null, h("th", {scope: "col"}, h("span", {"aria-hidden": "true"}, rets.length ? "Out ↓ Back →" : "")),
      cols.map(r => h("th", {scope: "col"}, r ? fWDM.format(dOnly(r)) : "Price")))),
    h("tbody", null, deps.map(d => h("tr", null, h("th", {scope: "row"}, fWDM.format(dOnly(d))), cols.map(r => cell(d, r))))));
}
function tripView(w) {
  return h("div", {class: "view"},
    h("a", {class: "back", href: "#"}, icon(I_CHEV_L), "All flights"),
    h("div", {class: "trip-head"},
      h("div", {class: "route"}, routeText(w), w.who ? h("span", {class: "tag"}, w.who) : null),
      h("h1", {tabindex: "-1"}, city(w.to)),
      h("div", {class: "when"}, `${dateRange(w.depart, w.return)} · ${daysText(daysUntil(w.depart))}`)),
    h("section", {class: "panel"}, pricePanel(w, state.which[w.id] || "cheapest")),
    historyChart(w),
    otherWeeks(w));
}

// ---------------- navigation: #/trip/<id>; anything else is the list ----------------
const state = {which: {}, open: {}};
function current() { const m = location.hash.match(/^#\/trip\/(.+)$/); return m ? (D.watches || []).find(w => w.id === decodeURIComponent(m[1])) : null; }
function render(switched) {
  if (chartObserver) { chartObserver.disconnect(); chartObserver = null; }
  const y = window.scrollY, w = current();
  document.getElementById("app").replaceChildren(w ? tripView(w) : listView());
  document.title = w ? `${city(w.to)} · Flight Prices` : "Flight Prices";
  if (switched) {  // switching flights keeps your place and focus
    window.scrollTo(0, y);
    const b = document.querySelector(`.seg button[data-k="${switched}"]`); if (b) b.focus();
  }
}
window.addEventListener("hashchange", () => {
  render(); window.scrollTo(0, 0);
  const h1 = document.querySelector("#app h1"); if (h1) h1.focus({preventScroll: true});
});
render();
setInterval(refreshStatus, MIN);
if (D.web && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});  // installable app + offline copy
}
</script>
</body>

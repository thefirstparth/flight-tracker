<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e7e5e0">
<!--__PWA_HEAD__-->
<title>Flight Prices</title>
<style>
/* One theme, between light and dark: warm stone, airport-signage navy, and
   colour only where it means something (green cheaper, red dearer, amber above the low). */
:root {
  color-scheme: light;
  --bg: #e7e5e0; --panel: #f6f5f2; --inset: #eeece7; --line: #dcd8d0;
  --ink: #161513; --ink-2: #57544e; --ink-3: #807c75;
  --navy: #1f3a5f; --navy-wash: #dfe5ec;
  --down: #12744a; --down-bg: #d9ede1; --up: #b3321f; --up-bg: #f5ded8; --amber: #835800; --amber-bg: #f1e6c9;
  --radius: 20px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
a { color: var(--navy); text-decoration: none; }
.num, .t { font-variant-numeric: tabular-nums; }
.caps { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }

/* top bar */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top h1 { margin: 4px 0 0; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
.status { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--ink-2); font-size: 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--down); flex: none; }
.dot.warn { background: var(--up); }
.actions { display: flex; gap: 8px; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink-2); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.menu { position: relative; }
.menu summary { list-style: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu-pop { position: absolute; right: 0; top: 48px; z-index: 5; min-width: 150px; padding: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(22,21,19,0.12); }
.menu-pop a { display: block; padding: 8px 12px; border-radius: 9px; color: var(--ink); }
.menu-pop a:hover { background: var(--inset); }
.notice { margin-top: 16px; padding: 12px 16px; border-radius: 14px; background: var(--navy-wash); color: var(--navy); font-size: 14px; }

/* trip board */
.trip { margin-top: 32px; animation: rise 0.35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.trip-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 8px 12px; }
.trip-head h2 { margin: 4px 0 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
.trip-head .when { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.countdown { text-align: right; flex: none; }
.countdown b { display: block; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }

.fare { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
.fare-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 24px 24px 16px; }
.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 999px; background: var(--navy-wash); color: var(--navy); }
.big { font-size: 40px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.05; margin-top: 8px; }
.verdict { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; font-weight: 550;
  padding: 4px 12px 4px 8px; border-radius: 999px; }
.verdict::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.v-down { background: var(--down-bg); color: var(--down); }
.v-up { background: var(--up-bg); color: var(--up); }
.v-amber { background: var(--amber-bg); color: var(--amber); }
.v-neutral { background: var(--inset); color: var(--ink-2); }
.side { text-align: right; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; }
.change { font-size: 14px; font-weight: 550; white-space: nowrap; }
.change.down { color: var(--down); } .change.up { color: var(--up); } .change.flat { color: var(--ink-3); font-weight: 500; }
.spark { width: 132px; height: 40px; display: block; }
.note { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); }

/* departure-board rows */
.board { background: var(--inset); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 24px; }
.board-row { display: grid; grid-template-columns: 52px 104px 168px minmax(0, 1fr) 70px; gap: 12px; align-items: center;
  padding: 12px 0; border-bottom: 1px dashed var(--line); }
.board-row:last-child { border-bottom: 0; }
.board-row .dir { font-size: 11px; letter-spacing: 0.09em; font-weight: 700; color: var(--ink-3); }
.board-row .date { font-size: 14px; color: var(--ink-2); }
.board-row .times { font-family: var(--mono); font-size: 18px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
.board-row .times .arr { color: var(--ink-3); font-weight: 400; margin: 0 8px; }
.board-row .times sup { font-size: 11px; color: var(--ink-3); font-weight: 500; }
.flight { display: flex; align-items: center; gap: 8px; min-width: 0; }
.flight .code { font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: 0.02em; white-space: nowrap; }
.flight .name { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center;
  color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.02em; }
.board-row .dur { text-align: right; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.board-row .dur b { display: block; color: var(--ink); font-weight: 550; font-size: 14px; }
.mdate { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: none; color: var(--ink-3); font-weight: 500; font-size: 13px; margin-right: 8px; }

/* options (all acceptable combinations) */
.options { padding: 16px 24px 8px; }
.options .caps { margin-bottom: 8px; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px 12px; align-items: center;
  padding: 12px 0; border-top: 1px solid var(--line); }
.opt .leg { display: flex; align-items: center; gap: 8px; min-width: 0; }
.opt .leg b { font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: -0.01em; white-space: nowrap; }
.opt .leg small { display: block; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt .price { text-align: right; font-weight: 650; font-size: 16px; white-space: nowrap; }
.opt .price small { display: block; font-weight: 600; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.opt.best .price, .opt.best .price small { color: var(--down); }
.pref { color: var(--navy); font-weight: 600; }
.show-all { border: 0; background: transparent; color: var(--navy); font: inherit; font-weight: 600; font-size: 14px;
  padding: 8px 0 4px; cursor: pointer; border-top: 1px solid var(--line); width: 100%; text-align: left; }

/* book or wait */
.advice { margin: 0 24px 16px; padding: 16px; border-radius: 16px; background: var(--inset); }
.advice-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.advice h3 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.advice.book h3 { color: var(--down); } .advice.fair h3 { color: var(--amber); } .advice.wait h3 { color: var(--up); }
.advice .sum { margin: 4px 0 12px; font-size: 14px; color: var(--ink-2); }
.scale { position: relative; height: 8px; border-radius: 999px; display: grid; grid-template-columns: 40fr 20fr 40fr; gap: 4px; }
.scale span { border-radius: 999px; }
.scale span:nth-child(1) { background: var(--down); } .scale span:nth-child(2) { background: #d6a531; } .scale span:nth-child(3) { background: var(--up); }
.scale .knob { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
  background: var(--panel); border: 4px solid var(--ink); box-shadow: 0 1px 4px rgba(22,21,19,0.25); }
.scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.scale-labels .on { color: var(--ink); font-weight: 650; }
.why { margin-top: 8px; }
.why .toggle { font-size: 14px; }
.reasons { list-style: none; margin: 8px 0 0; padding: 0; }
.reasons li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 0;
  border-top: 1px solid var(--line); font-size: 14px; }
.lean { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-align: center; border-radius: 999px; padding: 2px 0; margin-top: 2px; }
.lean-book { color: var(--down); background: var(--down-bg); }
.lean-wait { color: var(--up); background: var(--up-bg); }
.lean-neutral { color: var(--ink-3); background: var(--panel); }
.gchart { margin-top: 12px; }
.gchart .caps { margin-bottom: 4px; }
.gchart .band { fill: var(--down-bg); }
.gchart .band-label { fill: var(--down); font-size: 11px; font-weight: 600; }
.method { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
@media (max-width: 640px) { .advice { margin: 0 16px 16px; } }

/* how your dates compare */
.compare { border-top: 1px solid var(--line); }
.compare-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 16px 24px; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 550; padding: 8px 12px;
  border-radius: 999px; background: var(--inset); color: var(--ink-2); }
.chip.good { background: var(--down-bg); color: var(--down); }
.chip.bad { background: var(--up-bg); color: var(--up); }
.chip.meh { background: var(--amber-bg); color: var(--amber); }
.compare .toggle { margin-left: auto; font-size: 14px; }
.compare-body { padding: 0 24px 16px; }
.compare-body h4 { margin: 8px 0 8px; font-size: 14px; font-weight: 600; }
.compare-body .why { font-size: 12px; color: var(--ink-3); margin: -8px 0 8px; }
.weeks { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; align-items: end; height: 150px; }
.wk { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.wk .bar { width: 100%; max-width: 46px; border-radius: 6px 6px 3px 3px; background: #cfcac0; position: relative; }
.wk.yours .bar { background: var(--navy); }
.wk.cheap .bar { background: #9cc9ad; }
.wk .val { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wk.yours .val { color: var(--navy); font-weight: 700; }
.wk .lbl { font-size: 11px; color: var(--ink-3); white-space: nowrap; text-align: center; line-height: 1.2; }
.wk.yours .lbl { color: var(--ink); font-weight: 650; }
.typical { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.grid3 { display: grid; grid-template-columns: 92px repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.grid3 .hd { font-size: 12px; color: var(--ink-3); font-weight: 600; text-align: center; padding: 4px 0; }
.grid3 .rh { font-size: 12px; color: var(--ink-3); font-weight: 600; display: flex; align-items: center; }
.cell { border-radius: 12px; background: var(--inset); padding: 8px 8px; text-align: center; font-size: 14px; font-weight: 600;
  font-variant-numeric: tabular-nums; border: 2px solid transparent; }
.cell small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-3); }
.cell.yours { border-color: var(--navy); background: var(--panel); }
.cell.save { background: var(--down-bg); color: var(--down); }
.cell.save small { color: var(--down); }
.cell.na { color: var(--ink-3); font-weight: 400; }
@media (max-width: 640px) {
  .compare-head { padding: 12px 16px; }
  .compare .toggle { margin-left: 0; }
  .compare-body { padding: 0 16px 16px; }
  .weeks { gap: 4px; height: 140px; }
  .wk .val { font-size: 9.5px; }
  .wk .lbl { font-size: 9.5px; }
  .grid3 { grid-template-columns: 64px repeat(3, minmax(0, 1fr)); gap: 4px; }
  .cell { font-size: 13px; padding: 8px 4px; }
}

/* history + foot */
.more { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px 16px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--ink);
  font: inherit; font-weight: 550; cursor: pointer; padding: 4px 0; }
.toggle svg { width: 20px; height: 20px; transition: transform 0.2s; color: var(--ink-3); }
.toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.book { font-weight: 600; display: inline-flex; align-items: center; gap: 4px; padding: 8px 16px; border-radius: 999px;
  background: var(--navy); color: #fff; font-size: 14px; white-space: nowrap; }
.book:hover { background: #18304f; }
.history { padding: 0 24px 16px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 190px; touch-action: pan-y; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .cross { stroke: var(--ink-3); stroke-dasharray: 3 3; }
.tip { position: absolute; top: -4px; pointer-events: none; background: var(--ink); color: var(--panel); border-radius: 9px;
  padding: 4px 8px; font-size: 13px; white-space: nowrap; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.fact { background: var(--inset); border-radius: 14px; padding: 8px 12px; }
.fact b { display: block; font-size: 17px; font-weight: 650; margin-top: 4px; }
.fact span { font-size: 12px; color: var(--ink-3); }
.checked { font-size: 12px; color: var(--ink-3); }

footer { margin-top: 40px; text-align: center; color: var(--ink-3); font-size: 12px; }
.empty { text-align: center; padding: 64px 16px; color: var(--ink-2); }
html:not(.js) .actions { display: none; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; }
table.data td, table.data th { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: left; }

@media (max-width: 640px) {
  .wrap { padding-top: 24px; }
  .top h1 { font-size: 26px; }
  .fare-head { padding: 16px 16px 16px; }
  .big { font-size: 34px; }
  .spark { width: 96px; height: 34px; }
  .board { padding: 4px 16px; }
  .board-row { grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "dir times dur" "dir flight flight"; gap: 4px 8px; }
  .board-row .dir { grid-area: dir; align-self: start; padding-top: 4px; }
  .board-row .date { display: none; }
  .board-row .times { grid-area: times; font-size: 16px; }
  .board-row .flight { grid-area: flight; }
  .board-row .dur { grid-area: dur; }
  .board-row .dur b { display: inline; }
  .board-row .dur span { display: none; }
  .mdate { display: inline; }
  .options { padding: 16px 16px 4px; }
  .opt { grid-template-columns: minmax(0, 1fr) auto; }
  .opt .leg.out { grid-column: 1; grid-row: 1; }
  .opt .leg.back { grid-column: 1; grid-row: 2; }
  .opt .price { grid-column: 2; grid-row: 1 / span 2; }
  .more { padding: 12px 16px 16px; }
  .history { padding: 0 16px 16px; }
  .facts { gap: 8px; }
  .fact b { font-size: 15px; }
  .countdown b { font-size: 22px; }
  .trip-head h2 { font-size: 23px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="caps">Fare board · direct flights</div>
      <h1>Your flights</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="sub"></span></div>
    </div>
    <div class="actions" id="actions"></div>
  </header>
  <div id="notice"></div>
  <!--__NOSCRIPT__-->
  <main id="trips"></main>
  <footer>Prices from Google Flights for 1 adult in economy · always confirm on the airline's site before booking</footer>
</div>
<script id="data" type="application/json">/*__DASHBOARD_DATA__*/null</script>
<script>
"use strict";
document.documentElement.classList.add("js");
const D = JSON.parse(document.getElementById("data").textContent) || {watches: [], trips: []};
const TZ = "Asia/Kolkata", MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const nf = new Intl.NumberFormat("en-IN", {maximumFractionDigits: 0});
const inr = v => v == null ? "–" : "₹" + nf.format(Math.round(v));
const inrK = v => "₹" + (Math.round(v / 100) / 10) + "k";
const t = s => s ? Date.parse(s) : NaN;
const dOnly = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fmt = o => new Intl.DateTimeFormat("en-GB", Object.assign({timeZone: "UTC"}, o));
const fDM = fmt({day: "numeric", month: "short"}), fWDM = fmt({weekday: "short", day: "numeric", month: "short"});
const fW = fmt({weekday: "short"});
const fIST = new Intl.DateTimeFormat("en-GB", {timeZone: TZ, day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true});
const fISTd = new Intl.DateTimeFormat("en-GB", {timeZone: TZ, day: "numeric", month: "short"});
const AIR = Object.assign({}, D.airlines || {}, {"6E": "IndiGo", QP: "Akasa Air", IX: "Air India Express", AI: "Air India",
  SQ: "Singapore Airlines", TR: "Scoot"});
const LOGO = {"6E": "#1b2a8a", QP: "#e8541a", IX: "#c8441a", AI: "#a8121b", SQ: "#1c2d5a", TR: "#b38900",
  SG: "#c8102e", UK: "#5b2a5e", TG: "#5a2d82", FD: "#d71920", EK: "#c60c30"};
const CITY = {SIN: "Singapore", HKT: "Phuket", BLR: "Bengaluru", DEL: "Delhi", BOM: "Mumbai", MAA: "Chennai",
  HYD: "Hyderabad", CCU: "Kolkata", DXB: "Dubai", BKK: "Bangkok", KUL: "Kuala Lumpur", DPS: "Bali"};
const city = c => CITY[c] || c;
const code = f => f.split(" ")[0];
const isAny = f => !f || f === "any";

function h(tag, attrs, ...kids) {  // text always goes in as text nodes
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs, text) => { const el = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v); if (text != null) el.textContent = text; return el; };
const icon = d => { const v = s("svg", {viewBox: "0 0 24 24", "aria-hidden": "true"}); v.append(s("path", {d, fill: "currentColor"})); return v; };
const I_REFRESH = "M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z";
const I_MORE = "M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z";
const I_CHEV = "M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z";

const ago = ms => { const m = Math.round((Date.now() - ms) / MIN); if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const hr = Math.round(m / 60); return hr < 36 ? hr + " hr ago" : Math.round(hr / 24) + " days ago"; };
const daysUntil = d => Math.round((dOnly(d) - dOnly(new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(new Date()))) / DAY);
const hm = iso => iso.slice(11, 16);
const dur = m => Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m";

function logo(f) {
  const c = isAny(f) ? "✈" : code(f);
  return h("span", {class: "logo", style: `background:${LOGO[c] || "#807c75"}`, "aria-hidden": "true"}, c);
}
const points = w => (w.points || []).map(([ts, p]) => [t(ts), p]).filter(p => p[1] != null);
function valueAt(pts, x) { let v; for (const [ts, p] of pts) { if (ts <= x) v = p; else break; } return v; }

// ---- the headline: price, verdict, change, trend --------------------------------
function verdict(w, pts) {

    }
  }}, "Price history", icon(I_CHEV));
  return h("article", {class: "fare"},
    h("div", {class: "fare-head"},
      h("div", null,
        h("div", {class: "who"}, w.who ? h("span", {class: "tag"}, w.who) : null,
          h("span", {class: "caps"}, `${w.return ? "Round trip" : "One way"} · from ${city(w.from)}`)),
        h("div", {class: "big num"}, st.last != null ? inr(st.last) : "—"),
        h("div", {class: "verdict " + vcls}, vtext)),
      h("div", {class: "side"}, change(w, pts), sparkline(pts)),
      preferenceNote(w)),
    adviceBlock(w),
    board(w),
    compareBlock(w),
    optionsBlock(w),
    h("div", {class: "more"},
      h("div", null, toggle, h("div", {class: "checked"}, w.checked_at ? "Checked " + ago(t(w.checked_at)) : "Not checked yet")),
      h("a", {class: "book", href: w.link, target: "_blank", rel: "noopener noreferrer"}, "Book ↗")),
    hist);
}

function trip(tr) {
  const ws = tr.watches.map(id => D.watches.find(w => w.id === id)).filter(Boolean);
  const dest = ws.length ? ws[0].to : "", days = daysUntil(tr.start);
  const route = [...new Set(ws.map(w => w.from))].join(" / ") + (ws.some(w => w.return) ? " ⇄ " : " → ") + dest;
  const when = tr.start === tr.end ? fWDM.format(dOnly(tr.start))
    : `${fW.format(dOnly(tr.start))} ${fDM.format(dOnly(tr.start))} – ${fW.format(dOnly(tr.end))} ${fDM.format(dOnly(tr.end))} ${dOnly(tr.end).getUTCFullYear()}`;
  return h("section", {class: "trip"},
    h("div", {class: "trip-head"},
      h("div", null, h("div", {class: "caps"}, route), h("h2", null, tr.name || city(dest)), h("div", {class: "when"}, when)),
      h("div", {class: "countdown"}, h("b", {class: "num"}, days > 0 ? days : days === 0 ? "Today" : "—"),
        h("span", {class: "caps"}, days > 1 ? "days to go" : days === 1 ? "day to go" : ""))),
    ws.map(fare));
}

function header() {
  const sub = document.getElementById("sub"), dotEl = document.getElementById("dot");
  const last = t(D.updated_at);
  let warn = false;
  if (D.failed_runs > 0) { sub.textContent = `Google didn't answer the last ${D.failed_runs} check${D.failed_runs === 1 ? "" : "s"} · retrying`; warn = true; }
  else if (!last) sub.textContent = "Waiting for the first price check";
  else {
    const stale = Date.now() - last > 3 * (D.check_every_minutes || 30) * MIN;
    sub.textContent = stale ? `Last updated ${ago(last)} · checks seem to have stopped` : `Live · updated ${ago(last)}`;
    warn = stale;
  }
  dotEl.className = "dot" + (warn ? " warn" : "");
  const actions = document.getElementById("actions");
  actions.replaceChildren();
  if (D.web) {
    const btn = h("button", {class: "icon-btn", type: "submit", "aria-label": "Check prices now", title: "Check prices now"}, icon(I_REFRESH));
    actions.append(
      h("form", {method: "post", action: D.web.check_now, style: "margin:0", onsubmit: () => {
        btn.classList.add("spin"); btn.disabled = true; sub.textContent = "Checking prices… up to a minute"; }}, btn),
      h("details", {class: "menu"}, h("summary", {class: "icon-btn", "aria-label": "Menu", title: "Menu"}, icon(I_MORE)),
        h("div", {class: "menu-pop"}, h("a", {href: D.web.setup}, "Setup"), h("a", {href: D.web.logout}, "Log out"))));
  }
  const notice = document.getElementById("notice");
  notice.replaceChildren();
  const text = (D.web && D.web.notice) || (D.demo ? "Preview with made-up price history." : "");
  if (text) notice.append(h("div", {class: "notice"}, text));
}

header();
document.getElementById("trips").replaceChildren(...((D.trips || []).length ? D.trips.map(trip)
  : [h("div", {class: "empty"}, "No flights tracked yet.")]));
setInterval(() => { if (!document.querySelector(".spin")) header(); }, MIN);
if (D.web && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});  // installable app + offline copy
}
</script>
</body>
</html>

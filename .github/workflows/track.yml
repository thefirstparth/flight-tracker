# Second checker: runs the same price check from GitHub's servers every 30
# minutes, sharing the Vercel app's storage (Upstash Redis). Both use the same
# lock and the same "what is due" rules, so a route is searched by whichever
# runs first, and alerts are never sent twice. When Google refuses Vercel,
# the routes stay due and this checker picks them up.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   KV_REST_API_URL, KV_REST_API_TOKEN   - the same values as in Vercel
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID - the same values as in Vercel
# Until the storage secrets exist it does nothing.

name: Check flight prices

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub often starts it a few minutes late)
  workflow_dispatch:
    inputs:
      test:
        description: "Test only: one search per route from GitHub's servers; saves nothing, sends nothing, needs no secrets"
        type: boolean
        default: false
      probe:
        description: "Test only: one round-trip search with this version of the flights library (e.g. 0.11.1)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # the tracker stops retrying after 8 minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Probe a library version (nothing saved or sent)
        if: ${{ inputs.probe != '' }}
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          pip install -q "flights==$PROBE"
          python - <<'PY'
          import time
          from fli.core.builders import build_flight_segments
          from fli.models import Airport, FlightSearchFilters, MaxStops, PassengerInfo, SortBy
          from fli.search import SearchFlights
          segs, tt = build_flight_segments(Airport["BLR"], Airport["SIN"], "2027-03-02", "2027-03-07")
          f = FlightSearchFilters(trip_type=tt, passenger_info=PassengerInfo(adults=1), flight_segments=segs,
                                  stops=MaxStops.NON_STOP, sort_by=SortBy.CHEAPEST)
          t0 = time.time()
          try:
              rows = SearchFlights().search(f, top_n=3, currency="INR", country="IN", language="en") or []
          except Exception as e:
              print("FAILED:", type(e).__name__, str(e)[:300]); rows = []
          print(f"{len(rows)} round trips in {time.time() - t0:.1f}s")
          for r in rows[:5]:
              parts = r if isinstance(r, tuple) else (r,)
              print(" / ".join(f"{l.airline.name} {l.flight_number}" for p in parts for l in p.legs), parts[-1].price)
          PY

      - name: Test search (nothing saved or sent)
        if: ${{ inputs.test }}
        env:
          CHECKER: github-test
        run: |
          python tracker.py --dry-run --force
          python - <<'PY'
          import time
          from datetime import date
          from pathlib import Path
          import tracker
          settings, watches = tracker.load_config(Path("watches.toml"))
          w = watches[0]
          tracker._deadline = time.monotonic() + 120
          t0 = time.time()
          ins = tracker.trip_insights(w, settings, date.today())
          print(f"\nDate comparison for {w.origin}-{w.destination} in {time.time() - t0:.0f}s:")
          if not ins:
              print("  none")
          else:
              print("  same weekday:", [(x["depart"], x["price"]) for x in ins["similar"]])
              print("  a day either side:", [(x["depart"], x["return"], x["price"]) for x in ins["nearby"]])
          PY

      - name: Check prices
        if: ${{ !inputs.test && inputs.probe == '' }}
        env:
          CHECKER: github
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: https://flight-tracker-snowy.vercel.app
        run: |
          if [ -z "$KV_REST_API_URL" ] || [ -z "$KV_REST_API_TOKEN" ]; then
            echo "::notice::Storage secrets are not set yet, so nothing was checked."
            exit 0
          fi
          python tracker.py
